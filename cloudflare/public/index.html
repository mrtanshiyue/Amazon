<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Amazon Keyword Manager</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f5f5f7;
      --card:#fff;
      --text:#1d1d1f;
      --muted:#6e6e73;
      --line:#e5e5ea;
      --accent:#0071e3;
      --accent-soft:#eaf4ff;
      --danger:#c9342f;
      --danger-soft:#fff0ef;
      --good:#18864b;
      --input:#fff;
      --shadow:0 12px 34px rgba(0,0,0,.07);
      --radius:18px;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg:#141415;
      --card:#222224;
      --text:#f5f5f7;
      --muted:#a1a1a6;
      --line:#39393b;
      --accent:#2997ff;
      --accent-soft:#132b42;
      --danger:#ff6961;
      --danger-soft:#3c2020;
      --good:#32d06f;
      --input:#1c1c1e;
      --shadow:0 12px 34px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    body{font-size:14px}
    button,input,select{font:inherit}
    button{color:inherit}
    .app{max-width:1500px;margin:0 auto;padding:18px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;min-height:100vh}
    .sidebar,.panel,.topbar{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .sidebar{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;overflow:hidden}
    .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
    .brand h1{font-size:19px;margin:0 0 5px;letter-spacing:-.3px}
    .brand p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .side-tools{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:9px}
    .store-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}
    .store-tools select{min-width:0}
    .store-actions{display:flex;gap:5px}
    .store-actions .btn{padding:0 9px}
    .search-wrap{position:relative}
    .search-wrap input{padding-left:34px}
    .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    input[type="text"],input[type="number"],input[type="search"],select{width:100%;height:38px;border:1px solid var(--line);background:var(--input);color:var(--text);border-radius:10px;padding:0 11px;outline:none;transition:.18s border-color,.18s box-shadow}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
    .product-list{padding:10px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1}
    .product-item{width:100%;border:1px solid transparent;background:transparent;border-radius:14px;padding:9px;text-align:left;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center}
    .product-item:hover{background:color-mix(in srgb,var(--line) 28%,transparent)}
    .product-item.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
    .thumb{width:48px;height:48px;border-radius:11px;border:1px solid var(--line);background:var(--card);object-fit:contain;display:block;padding:3px}
    .thumb.placeholder{display:grid;place-items:center;color:var(--muted);font-size:18px}
    .product-meta{min-width:0}
    .product-sku{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .product-asin{margin-top:3px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .product-counts{margin-top:5px;color:var(--muted);font-size:11px}
    .side-footer{padding:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .main{display:flex;flex-direction:column;gap:14px;min-width:0}
    .topbar{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title h2{font-size:20px;margin:0 0 4px;letter-spacing:-.3px}
    .title div{color:var(--muted);font-size:12px}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:36px;padding:0 14px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.18s transform,.18s background,.18s border-color}
    .btn:hover{background:color-mix(in srgb,var(--line) 25%,var(--card));border-color:color-mix(in srgb,var(--muted) 45%,var(--line))}
    .btn:active{transform:scale(.98)}
    .btn.primary{background:var(--accent);color:white;border-color:var(--accent)}
    .btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
    .btn.danger{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 25%,var(--line))}
    .btn.small{min-height:30px;padding:0 10px;font-size:12px}
    .btn.icon{width:32px;height:32px;min-height:32px;padding:0;border-radius:50%}
    .panel{padding:16px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .panel-title{font-size:15px;font-weight:800}
    .panel-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
    .product-editor{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:start}
    .image-box{width:150px;aspect-ratio:1;border:1px dashed color-mix(in srgb,var(--muted) 55%,var(--line));border-radius:16px;background:var(--bg);overflow:hidden;display:grid;place-items:center;position:relative}
    .image-box img{width:100%;height:100%;object-fit:contain;background:var(--card);padding:6px}
    .image-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5}
    .image-actions{display:flex;gap:7px;margin-top:8px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field label{display:block;font-size:11.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:650}
    .field .hint{font-size:10.5px;color:var(--muted);margin-top:5px}
    .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .stat{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:11.5px;color:var(--muted)}
    .stat b{color:var(--text)}
    .table-wrap{width:100%;overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:760px}
    th,td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:middle}
    th{position:sticky;top:0;background:var(--card);z-index:1;text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.25px;white-space:nowrap}
    tr:last-child td{border-bottom:0}
    td.term{min-width:250px}
    td.bid{width:126px}
    td.action{width:44px;text-align:center}
    .bid-input{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--input);overflow:hidden;height:36px}
    .bid-input span{padding-left:10px;color:var(--muted);font-size:12px}
    .bid-input input{height:34px;border:0;border-radius:0;padding-left:4px;box-shadow:none;min-width:0}
    .check-cell{width:100px;text-align:center}
    .check{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
    .check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
    .empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:12.5px}
    .empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
    .notice{border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:11.5px;line-height:1.5;color:color-mix(in srgb,var(--text) 88%,var(--muted))}
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--card);padding:9px 13px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .hidden{display:none!important}
    .file-input{display:none}
    .welcome{min-height:calc(100vh - 36px);display:grid;place-items:center;padding:30px}
    .welcome-card{max-width:560px;text-align:center}
    .welcome-card .mark{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:28px;margin:0 auto 15px}
    .welcome-card h2{margin:0 0 8px;font-size:23px}
    .welcome-card p{margin:0 auto 18px;color:var(--muted);line-height:1.6;max-width:480px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
    .modal-backdrop.open{display:flex}
    .modal-card{width:min(1080px,100%);max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 28px 80px rgba(0,0,0,.22)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
    .modal-head h2{margin:0;font-size:19px;letter-spacing:-.2px}
    .modal-body{padding:20px}
    .modal-image-row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start;margin-bottom:18px}
    .modal-image-preview{width:170px;aspect-ratio:1;border:1px dashed color-mix(in srgb,var(--muted) 55%,var(--line));border-radius:16px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:12px;text-align:center;line-height:1.5;padding:8px}
    .modal-image-preview img{width:100%;height:100%;object-fit:contain;background:var(--card)}
    .modal-image-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .modal-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .modal-note{color:var(--muted);font-size:11.5px;line-height:1.55;margin-top:8px}
    .modal-section{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
    .modal-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .modal-section-title{font-weight:800;font-size:14px}
    .modal-editor-empty{padding:22px 12px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:12px}
    .modal-footer{display:flex;justify-content:space-between;gap:9px;padding:14px 20px 20px}
    .modal-footer-right{display:flex;gap:9px}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .readonly-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .readonly-field{min-width:0}
    .readonly-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px}
    .readonly-value{min-height:38px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;word-break:break-word}
    .read-table td{font-size:13px}
    .read-empty{padding:24px 12px;text-align:center;color:var(--muted)}
    .match-badges{display:flex;gap:6px;flex-wrap:wrap}
    .match-badge{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 8px;font-size:11px}
    .modal-footer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:3}
    @media (max-width:900px){
      .app{grid-template-columns:1fr;padding:10px;gap:10px}
      .sidebar{position:relative;top:0;height:auto;max-height:44vh}
      .main{min-width:0}
      .topbar{align-items:flex-start}
      .product-editor{grid-template-columns:110px minmax(0,1fr)}
      .image-box{width:110px}
    }
    @media (max-width:620px){
      body{font-size:13px}
      .app{padding:8px}
      .sidebar{max-height:38vh;border-radius:15px}
      .topbar,.panel{border-radius:15px}
      .topbar{flex-direction:column}
      .top-actions{width:100%;justify-content:flex-start}
      .product-editor{grid-template-columns:1fr}
      .image-box{width:130px}
      .fields{grid-template-columns:1fr}
      .panel{padding:13px}
      .side-footer{grid-template-columns:1fr 1fr}
      .modal-backdrop{padding:10px}
      .modal-card{border-radius:18px}
      .modal-image-row{grid-template-columns:1fr}
      .modal-image-preview{width:150px}
      .modal-fields{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Amazon Keyword Manager</h1>
        <p>多店铺 · Cloudflare 云端数据 · R2 商品图片</p>
      </div>
      <div class="side-tools">
        <div class="store-tools">
          <select id="storeSelect" aria-label="选择店铺"></select>
          <div class="store-actions">
            <button class="btn small" data-store-action="add" title="新建店铺">＋店铺</button>
            <button class="btn small" data-store-action="rename" title="重命名店铺">改名</button>
            <button class="btn small danger" data-store-action="delete" title="删除店铺">删除</button>
          </div>
        </div>
        <button class="btn primary" id="addProductBtn">＋ 新建产品</button>
        <button class="btn" id="editProductBtn">编辑当前产品</button>
        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索 SKU、ASIN、关键词…" autocomplete="off" />
        </div>
      </div>
      <div class="product-list" id="productList"></div>
      <div class="side-footer">
        <button class="btn small" id="exportBtn">导出备份</button>
        <button class="btn small" id="importBtn">恢复备份</button>
        <input class="file-input" id="importFile" type="file" accept="application/json,.json" />
      </div>
    </aside>

    <main class="main" id="main"></main>
  </div>

  <div class="modal-backdrop" id="productModal" aria-hidden="true">
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
      <div class="modal-head">
        <h2 id="productModalTitle">添加商品</h2>
        <button class="btn icon" id="productModalCloseBtn" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-image-row">
          <div>
            <div class="modal-image-preview" id="productModalImagePreview">完整商品图片预览</div>
            <div class="modal-image-actions">
              <button class="btn small" id="productModalChooseImageBtn" type="button">选择图片</button>
              <button class="btn small hidden" id="productModalRemoveImageBtn" type="button">移除图片</button>
            </div>
          </div>
          <div>
            <div class="modal-fields">
              <div class="field">
                <label for="productModalSku">SKU</label>
                <input id="productModalSku" type="text" placeholder="例如 YS005" autocomplete="off" />
              </div>
              <div class="field">
                <label for="productModalAsin">ASIN</label>
                <input id="productModalAsin" type="text" placeholder="例如 B0XXXXXXXX" autocomplete="off" />
              </div>
            </div>
            <div class="modal-note">所有商品信息与关键词只在这个窗口中维护。右侧详情页只负责展示。</div>
          </div>
        </div>

        <div class="modal-section">
          <div class="modal-section-head">
            <div>
              <div class="modal-section-title">关键词</div>
              <div class="panel-sub">维护 Exact / Phrase / Broad Bid</div>
            </div>
            <button class="btn primary small" id="productModalAddKeywordBtn" type="button">＋ 添加关键词</button>
          </div>
          <div id="productModalKeywordEditor"></div>
        </div>

        <div class="modal-section">
          <div class="modal-section-head">
            <div>
              <div class="modal-section-title">否定词</div>
              <div class="panel-sub">Negative Exact / Negative Phrase</div>
            </div>
            <button class="btn primary small" id="productModalAddNegativeBtn" type="button">＋ 添加否定词</button>
          </div>
          <div id="productModalNegativeEditor"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn danger hidden" id="productModalDeleteBtn" type="button">删除商品</button>
        <div class="modal-footer-right">
          <button class="btn" id="productModalCancelBtn" type="button">取消</button>
          <button class="btn primary" id="productModalSaveBtn" type="button">保存商品</button>
        </div>
      </div>
      <input class="file-input" id="productModalImageFile" type="file" accept="image/*" />
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input class="file-input" id="imageFile" type="file" accept="image/*" />

  <script>
    const API_BASE = '/api';
    let stateVersion = '';

    const state = {
      stores: [],
      selectedStoreId: null,
      search: ''
    };

    const $ = (selector) => document.querySelector(selector);
    const uid = () => crypto.randomUUID
      ? crypto.randomUUID()
      : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    let pendingProductImageData = '';
    let pendingRemoveProductImage = false;
    let productModalMode = 'create';
    let productModalDraft = null;

    async function apiJson(path, options = {}) {
      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers: {
          'accept': 'application/json',
          ...(options.body ? { 'content-type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    async function saveCloudNow() {
      const response = await fetch(`${API_BASE}/state`, {
        method: 'PUT',
        headers: {
          'accept': 'application/json',
          'content-type': 'application/json',
          ...(stateVersion ? { 'if-match': stateVersion } : { 'if-none-match': '*' })
        },
        body: JSON.stringify({
          version: 2,
          stores: state.stores
        })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 409) {
          throw new Error('云端数据已被其他设备修改，请刷新页面后重试');
        }
        throw new Error(data.error || `HTTP ${response.status}`);
      }
      stateVersion = response.headers.get('etag') || stateVersion;
      return data;
    }

    let saveTimer = null;
    function saveSoon() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          await saveCloudNow();
        } catch (error) {
          console.error(error);
          toast(error.message.includes('authentication') ? '请先通过 Cloudflare Access 登录' : '云端保存失败');
        }
      }, 220);
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function toNumberOrBlank(value) {
      if (value === '') return '';
      const n = Number(value);
      return Number.isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : '';
    }

    function makeStore(name) {
      return {
        id: uid(),
        name: name || '未命名店铺',
        products: [],
        selectedId: null
      };
    }

    function currentStore() {
      return state.stores.find(store => store.id === state.selectedStoreId) || null;
    }

    function currentProducts() {
      return currentStore()?.products || [];
    }

    function newProduct() {
      openProductModal('create');
    }

    function editCurrentProduct() {
      if (!selectedProduct()) return toast('请先选择一个产品');
      openProductModal('edit');
    }

    function cloneProductForModal(product) {
      return {
        id: product?.id || uid(),
        sku: product?.sku || '',
        asin: product?.asin || '',
        image: product?.image || '',
        keywords: (product?.keywords || []).map(row => ({ ...row })),
        negatives: (product?.negatives || []).map(row => ({ ...row }))
      };
    }

    function renderProductModalImage() {
      const preview = $('#productModalImagePreview');
      const removeBtn = $('#productModalRemoveImageBtn');
      const image = pendingProductImageData || productModalDraft?.image || '';
      if (image) {
        preview.innerHTML = `<img src="${image}" alt="商品图片" />`;
        removeBtn.classList.remove('hidden');
      } else {
        preview.textContent = '完整商品图片预览';
        removeBtn.classList.add('hidden');
      }
    }

    function renderProductModalEditors() {
      const keywordHost = $('#productModalKeywordEditor');
      const negativeHost = $('#productModalNegativeEditor');
      const draft = productModalDraft;
      if (!draft) return;

      keywordHost.innerHTML = draft.keywords.length
        ? `<div class="table-wrap"><table>
            <thead><tr><th>关键词</th><th>Exact Bid</th><th>Phrase Bid</th><th>Broad Bid</th><th></th></tr></thead>
            <tbody>${draft.keywords.map(row => `<tr data-modal-keyword-row="${row.id}">
              <td class="term"><input type="text" data-modal-k-field="term" value="${escapeHtml(row.term)}" placeholder="输入关键词" /></td>
              <td class="bid"><div class="bid-input"><span>$</span><input type="number" min="0" step="0.01" data-modal-k-field="exact" value="${escapeHtml(row.exact)}" placeholder="0.00" /></div></td>

    async function saveProductFromModal() {
      if (!productModalDraft) return;
      productModalDraft.sku = $('#productModalSku').value.trim();
      productModalDraft.asin = $('#productModalAsin').value.trim().toUpperCase();

      if (!productModalDraft.sku && !productModalDraft.asin) {
        toast('请至少填写 SKU 或 ASIN');
        $('#productModalSku').focus();
        return;
      }

      let store = currentStore();
      let createdStore = false;
      if (!store) {
        store = makeStore(`店铺 ${state.stores.length + 1}`);
        state.stores.push(store);
        state.selectedStoreId = store.id;
        createdStore = true;
      }

      const saveBtn = $('#productModalSaveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';

      if (productModalMode === 'create') {
        const product = cloneProductForModal(productModalDraft);
        product.image = '';
        const previousSelectedId = store.selectedId;
        store.products.unshift(product);
        store.selectedId = product.id;

        try {
          await saveCloudNow();
          if (pendingProductImageData) {
            await uploadDataImage(product, pendingProductImageData);
          }
          closeProductModal();
          render();
          toast('商品已保存');
        } catch (error) {
          console.error(error);
          store.products = store.products.filter(item => item.id !== product.id);
          store.selectedId = previousSelectedId;
          if (createdStore && store.products.length === 0) {
            state.stores = state.stores.filter(item => item.id !== store.id);
            state.selectedStoreId = state.stores[0]?.id || null;
          }
          render();
          toast(error.message || '商品保存失败');
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = '保存商品';
        }
        return;
      }

      const product = selectedProduct();
      if (!product) {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存商品';
        return toast('当前商品不存在');
      }

      const backup = cloneProductForModal(product);
      try {
        product.sku = productModalDraft.sku;
        product.asin = productModalDraft.asin;
        product.keywords = productModalDraft.keywords.map(row => ({ ...row }));
        product.negatives = productModalDraft.negatives.map(row => ({ ...row }));
        if (pendingRemoveProductImage) product.image = '';

        await saveCloudNow();

        if (pendingRemoveProductImage && backup.image) {
          await deleteProductImageById(product.id);
        }
        if (pendingProductImageData) {
          await uploadDataImage(product, pendingProductImageData);
        }

        closeProductModal();
        render();
        toast('商品修改已保存');
      } catch (error) {
        console.error(error);
        Object.assign(product, backup);
        render();
        toast(error.message || '商品保存失败');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存商品';
      }
    }

      ].join(' ').toLowerCase();
      return haystack.includes(query.toLowerCase());

    async function compressImage(file) {
      const source = await loadImageSource(file);
      const sourceWidth = source.width || source.naturalWidth;
      const sourceHeight = source.height || source.naturalHeight;
      const max = 720;
      const scale = Math.min(1, max / Math.max(sourceWidth, sourceHeight));
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(source, 0, 0, width, height);
      source.close?.();
      if (source._objectUrl) URL.revokeObjectURL(source._objectUrl);
      return canvas.toDataURL('image/jpeg', .84);
    }

    async function loadImageSource(file) {
      if ('createImageBitmap' in window) {
        return createImageBitmap(file);
      }
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => { image._objectUrl = url; resolve(image); };
        image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image decode failed')); };
        image.src = url;
      });
    }

      product.image = data.url;

    function blobToDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function exportBackup() {
      const stores = structuredClone(state.stores);
      for (const store of stores) {
        for (const product of store.products) {
          if (typeof product.image === 'string' && product.image.startsWith('/api/images/')) {
            try {
              const response = await fetch(product.image);
              if (response.ok) product.image = await blobToDataUrl(await response.blob());
            } catch (error) {
              console.error('Backup image fetch failed', product.id, error);
              product.image = '';
            }
          }
        }
      }
      const payload = {
        app: 'Amazon Keyword Manager',
        version: 2,
        exportedAt: new Date().toISOString(),
        selectedStoreId: state.selectedStoreId,
        stores
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `amazon-keywords-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('备份已导出');
    }

    async function importBackup(file) {
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        let stores;
        if (Array.isArray(parsed.stores)) {
          stores = parsed.stores.map((store, index) => normalizeStore(store, index));
        } else if (Array.isArray(parsed.products)) {
          stores = [normalizeStore({
            name: '店铺 1',
            products: parsed.products,
            selectedId: parsed.products[0]?.id || null
          }, 0)];
        } else {
          throw new Error('Invalid backup');
        }
        if (!stores.length) stores = [makeStore('店铺 1')];
        const productCount = stores.reduce((sum, store) => sum + store.products.length, 0);
        if (!confirm(`将用备份中的 ${stores.length} 个店铺、${productCount} 个产品覆盖当前数据，继续吗？`)) return;
        state.stores = stores;
        state.selectedStoreId = stores.some(store => store.id === parsed.selectedStoreId)
          ? parsed.selectedStoreId
          : stores[0].id;
        state.search = '';
        $('#searchInput').value = '';

        const pendingImages = [];
        for (const store of state.stores) {
          for (const product of store.products) {
            if (typeof product.image === 'string' && product.image.startsWith('data:image/')) {
              pendingImages.push([product, product.image]);
              product.image = '';
            }
          }
        }

        await saveCloudNow();
        for (const [product, dataUrl] of pendingImages) {
          await uploadDataImage(product, dataUrl);
        }
        render();
        toast('备份已恢复到 Cloudflare');
      } catch (error) {
        console.error(error);
        toast('备份文件无效');
      } finally {
        $('#importFile').value = '';
      }
    }

    function normalizeStore(raw, index = 0) {
      const products = Array.isArray(raw?.products) ? raw.products.map(normalizeProduct) : [];
      const selectedId = products.some(product => product.id === raw?.selectedId)
        ? raw.selectedId
        : products[0]?.id || null;
      return {
        id: typeof raw?.id === 'string' ? raw.id : uid(),
        name: typeof raw?.name === 'string' && raw.name.trim() ? raw.name.trim() : `店铺 ${index + 1}`,
        products,
        selectedId
      };
    }

    function normalizeProduct(raw) {
      return {
        id: typeof raw?.id === 'string' ? raw.id : uid(),
        sku: typeof raw?.sku === 'string' ? raw.sku : '',
        asin: typeof raw?.asin === 'string' ? raw.asin : '',
        image: typeof raw?.image === 'string' && (raw.image.startsWith('data:image/') || raw.image.startsWith('/api/images/')) ? raw.image : '',
        keywords: Array.isArray(raw?.keywords) ? raw.keywords.map(k => ({
          id: typeof k?.id === 'string' ? k.id : uid(),
          term: typeof k?.term === 'string' ? k.term : '',
          exact: toNumberOrBlank(k?.exact ?? ''),
          phrase: toNumberOrBlank(k?.phrase ?? ''),
          broad: toNumberOrBlank(k?.broad ?? '')
        })) : [],
        negatives: Array.isArray(raw?.negatives) ? raw.negatives.map(n => ({
          id: typeof n?.id === 'string' ? n.id : uid(),
          term: typeof n?.term === 'string' ? n.term : '',
          exact: Boolean(n?.exact),
          phrase: Boolean(n?.phrase)
        })) : []
      };
    }

    document.addEventListener('click', (event) => {
      const storeAction = event.target.closest('[data-store-action]');
      if (storeAction) {
        const action = storeAction.dataset.storeAction;
        if (action === 'add') addStore();
        if (action === 'rename') renameStore();
        if (action === 'delete') deleteStore();
        return;
      }

      const productButton = event.target.closest('[data-select-product]');
      if (productButton) {
        const store = currentStore();
        if (store) store.selectedId = productButton.dataset.selectProduct;
        render();
        return;
      }

      const actionButton = event.target.closest('[data-action]');
      if (actionButton) {
        const action = actionButton.dataset.action;
        if (action === 'new-product') newProduct();
        return;
      }


    });

    $('#storeSelect').addEventListener('change', (e) => switchStore(e.target.value));
    $('#addProductBtn').addEventListener('click', newProduct);
    $('#editProductBtn').addEventListener('click', editCurrentProduct);
    $('#productModalCloseBtn').addEventListener('click', closeProductModal);
    $('#productModalCancelBtn').addEventListener('click', closeProductModal);
    $('#productModalSaveBtn').addEventListener('click', saveProductFromModal);
    $('#productModalAddKeywordBtn').addEventListener('click', addModalKeyword);
    $('#productModalAddNegativeBtn').addEventListener('click', addModalNegative);
    $('#productModalDeleteBtn').addEventListener('click', () => {
      closeProductModal();
      deleteProduct();
    });
    $('#productModalChooseImageBtn').addEventListener('click', () => $('#productModalImageFile').click());
    $('#productModalRemoveImageBtn').addEventListener('click', () => {
      pendingProductImageData = '';
      pendingRemoveProductImage = true;
      if (productModalDraft) productModalDraft.image = '';
      $('#productModalImageFile').value = '';
      renderProductModalImage();
    });
    $('#productModalImageFile').addEventListener('change', (e) => {
      handleNewProductImage(e.target.files?.[0]);
      e.target.value = '';
    });
    $('#productModal').addEventListener('input', (e) => {
      if (!productModalDraft) return;
      const keywordRow = e.target.closest('[data-modal-keyword-row]');
      if (keywordRow && e.target.dataset.modalKField) {
        const row = productModalDraft.keywords.find(item => item.id === keywordRow.dataset.modalKeywordRow);
        if (row) {
          const field = e.target.dataset.modalKField;
          row[field] = field === 'term' ? e.target.value : toNumberOrBlank(e.target.value);
        }
      }
      const negativeRow = e.target.closest('[data-modal-negative-row]');
      if (negativeRow && e.target.dataset.modalNField === 'term') {
        const row = productModalDraft.negatives.find(item => item.id === negativeRow.dataset.modalNegativeRow);
        if (row) row.term = e.target.value;
      }
    });
    $('#productModal').addEventListener('change', (e) => {
      if (!productModalDraft) return;
      const negativeRow = e.target.closest('[data-modal-negative-row]');
      if (negativeRow && e.target.dataset.modalNField && e.target.dataset.modalNField !== 'term') {
        const row = productModalDraft.negatives.find(item => item.id === negativeRow.dataset.modalNegativeRow);
        if (row) row[e.target.dataset.modalNField] = e.target.checked;
      }
    });
    $('#productModal').addEventListener('click', (e) => {
      const deleteKeyword = e.target.closest('[data-modal-delete-keyword]');
      if (deleteKeyword && productModalDraft) {
        productModalDraft.keywords = productModalDraft.keywords.filter(row => row.id !== deleteKeyword.dataset.modalDeleteKeyword);
        renderProductModalEditors();
        return;
      }
      const deleteNegative = e.target.closest('[data-modal-delete-negative]');
      if (deleteNegative && productModalDraft) {
        productModalDraft.negatives = productModalDraft.negatives.filter(row => row.id !== deleteNegative.dataset.modalDeleteNegative);
        renderProductModalEditors();
        return;
      }
      if (e.target === $('#productModal')) closeProductModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeProductModal();
    });
    $('#searchInput').addEventListener('input', (e) => {
      state.search = e.target.value.trim();
      renderSidebar();
    });
    $('#exportBtn').addEventListener('click', exportBackup);
    $('#importBtn').addEventListener('click', () => $('#importFile').click());
    $('#importFile').addEventListener('change', (e) => importBackup(e.target.files[0]));
    $('#imageFile').addEventListener('change', (e) => {
      handleImage(e.target.files[0]);
      e.target.value = '';
    });

    async function init() {
      applySavedTheme();
      try {
        const response = await fetch(`${API_BASE}/state`, {
          headers: { 'accept': 'application/json' }
        });
        const saved = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(saved.error || `HTTP ${response.status}`);
        stateVersion = response.headers.get('etag') || '';
        if (saved && Array.isArray(saved.stores)) {
          state.stores = saved.stores.map((store, index) => normalizeStore(store, index));
          state.selectedStoreId = state.stores[0]?.id || null;
        }
        if (!state.stores.length) {
          const firstStore = makeStore('店铺 1');
          state.stores = [firstStore];
          state.selectedStoreId = firstStore.id;
          await saveCloudNow();
        }
      } catch (error) {
        console.error(error);
        toast(error.message.includes('authentication') ? '请先配置并登录 Cloudflare Access' : 'Cloudflare 数据读取失败');
      }
      render();
    }

    init();
  </script>
</body>
</html>
