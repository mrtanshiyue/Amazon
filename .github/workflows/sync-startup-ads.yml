name: Sync MoYu full Surge module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-startup-ads.yml"
      - ".github/scripts/sync_startup_ads.py"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-moyu-full-surge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile converter
        shell: bash
        run: python3 -m py_compile .github/scripts/sync_startup_ads.py

      - name: Fetch README catalog, convert and validate
        shell: bash
        run: python3 .github/scripts/sync_startup_ads.py

      - name: Commit full module when changed
        shell: bash
        run: |
          if git diff --quiet -- modules/StartUpAds-Surge.sgmodule; then
            echo "No MoYu full module changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/StartUpAds-Surge.sgmodule
          git commit -m "chore: sync MoYu full Surge module"
          git push
