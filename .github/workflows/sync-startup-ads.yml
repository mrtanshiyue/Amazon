name: Sync Surge-compatible startup ads module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-startup-ads.yml"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-surge-startup-ads
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream and convert for Surge
        shell: python
        run: |
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          SOURCE = "https://raw.githubusercontent.com/Walvez/surge-startup-ads/main/dist/StartUpAds_Selected.sgmodule"
          TARGET = Path("modules/StartUpAds-Surge.sgmodule")
          def fetch_text(url: str) -> str:
              request = Request(url, headers={"User-Agent": "surge-config-startup-ads-sync/1.0"})
              with urlopen(request, timeout=30) as response:
                  return response.read().decode("utf-8-sig").replace("\r\n", "\n")

          def split_sections(text: str):
              order = []
              sections = {}
              current = None
              for line in text.split("\n"):
                  match = re.match(r"^\[([^\]]+)\]\s*$", line)
                  if match:
                      current = match.group(1)
                      if current not in sections:
                          sections[current] = []
                          order.append(current)
                      continue
                  if current is not None:
                      sections[current].append(line)
              return order, sections

          def fix_body_rewrite(line: str) -> str:
              if line.startswith("http-response-jq ") or not re.match(r"^http-(?:request|response)\s", line):
                  return line

              parts = line.strip().split()
              if len(parts) < 4:
                  raise SystemExit(f"Invalid Body Rewrite line: {line}")

              head = parts[:2]
              rest = parts[2:]

              if len(rest) == 2:
                  search, replacement = rest
              else:
                  if len(rest) % 2:
                      raise SystemExit(f"Ambiguous Body Rewrite line: {line}")
                  half = len(rest) // 2
                  search = r"\x20".join(rest[:half])
                  replacement = r"\x20".join(rest[half:])

              search = search.replace('"', r"\x22")
              replacement = replacement.replace('"', r"\x22")
              return " ".join([*head, search, replacement])

          def fix_script(line: str) -> str:
              match = re.match(
                  r"^(.*?)\s*=\s*type=(http-request|http-response),\s*"
                  r"pattern=(.*),\s*requires-body=(true|false),\s*"
                  r"max-size=([^,]+),\s*timeout=([^,]+),\s*script-path=(\S+)\s*$",
                  line,
              )
              if not match:
                  raise SystemExit(f"Unsupported Script syntax: {line}")

              name, script_type, pattern, requires_body, max_size, timeout, script_path = match.groups()
              pattern = pattern.strip()
              if "," in pattern and not (
                  len(pattern) >= 2 and pattern.startswith('"') and pattern.endswith('"')
              ):
                  pattern = '"' + pattern.replace('"', r'\"') + '"'

              params = [
                  f"type={script_type}",
                  f"pattern={pattern}",
                  f"script-path={script_path}",
              ]
              if requires_body.lower() == "true":
                  params.append("requires-body=true")

              max_size = max_size.strip()
              if max_size != "-1":
                  params.append(f"max-size={max_size}")

              timeout = timeout.strip()
              if timeout not in {"5", "60"}:
                  params.append(f"timeout={timeout}")

              return f"{name.strip()} = " + ",".join(params)

          def convert(source: str) -> str:
              raw_url = "https://raw.githubusercontent.com/mrtanshiyue/Amazon/main/modules/StartUpAds-Surge.sgmodule"
              if len(source) < 60000:
                  raise SystemExit("Unexpectedly short upstream module; keeping existing file")
              if "#!name=Surge 去开屏模块" not in source:
                  raise SystemExit("Unexpected upstream module header")
              if "[URL Rewrite]" not in source or "[MITM]" not in source:
                  raise SystemExit("Required upstream sections missing")

              order, sections = split_sections(source)

              url_rewrite = []
              converted_map_local = []
              pending = []

              for raw in sections.get("URL Rewrite", []):
                  stripped = raw.strip()
                  if not stripped or stripped.startswith("#"):
                      pending.append(raw)
                      continue

                  match = re.match(
                      r"^(.*?)\s+-\s+(reject(?:-[A-Za-z0-9_-]+)?)\s*$",
                      raw,
                      re.IGNORECASE,
                  )
                  if not match:
                      raise SystemExit(f"Unsupported URL Rewrite syntax: {raw}")

                  pattern, action = match.groups()
                  pattern = pattern.strip()
                  action = action.lower()

                  destination = url_rewrite if action == "reject" else converted_map_local
                  destination.extend(pending)
                  pending = []

                  if action == "reject":
                      destination.append(f"{pattern} _ reject")
                  elif action == "reject-200":
                      destination.append(f'{pattern} data-type=text data="" status-code=200')
                  elif action == "reject-dict":
                      destination.append(
                          f'{pattern} data-type=text data="{{}}" status-code=200 '
                          'header="Content-Type:application/json"'
                      )
                  elif action == "reject-img":
                      destination.append(f"{pattern} data-type=tiny-gif status-code=200")
                  else:
                      raise SystemExit(f"Unsupported URL Rewrite action: {action}")

              url_rewrite.extend(pending)
              sections["URL Rewrite"] = url_rewrite
              sections["Map Local"] = converted_map_local + sections.get("Map Local", [])
              sections["Body Rewrite"] = [
                  fix_body_rewrite(line) if line.strip() and not line.lstrip().startswith("#") else line
                  for line in sections.get("Body Rewrite", [])
              ]
              sections["Script"] = [
                  fix_script(line) if line.strip() and not line.lstrip().startswith("#") else line
                  for line in sections.get("Script", [])
              ]

              header = [
                  "#!name=Surge 去开屏模块（兼容版）",
                  "#!desc=每日同步 Walvez 上游，并自动转换为 Surge 当前兼容语法",
                  "#!author=ddgksf2013 + Walvez",
                  "#!homepage=https://github.com/Walvez/surge-startup-ads",
                  f"#!raw-url={raw_url}",
                  "#!category=去广告",
                  "#!requirement=CORE_VERSION>=20",
                  "#!remark=由 mrtanshiyue/Amazon 自动维护；每日同步 Walvez 上游并按 Surge 当前语法转换 Rewrite / HTTP Script。",
                  "",
                  f"# Source: {SOURCE}",
                  "",
              ]

              output = list(header)
              for section in order:
                  output.append(f"[{section}]")
                  output.extend(sections[section])
                  output.append("")

              result = "\n".join(output).rstrip() + "\n"

              if re.search(r"\s-\sreject(?:-[A-Za-z0-9_-]+)?\s*$", result, re.MULTILINE):
                  raise SystemExit("Legacy reject syntax survived conversion")
              if re.search(r"^http-(?:request|response)\s+\S+\s+\S*\"\S*", result, re.MULTILINE):
                  raise SystemExit("Unescaped Body Rewrite quote survived conversion")
              script_text = result.split("[Script]", 1)[1].split("[MITM]", 1)[0]
              script_lines = [
                  line.strip()
                  for line in script_text.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]
              for line in script_lines:
                  if re.match(r"^http-(?:request|response)\s", line):
                      raise SystemExit(f"Legacy Script syntax survived conversion: {line}")
                  if "max-size=-1" in line:
                      raise SystemExit(f"Unlimited Script body survived conversion: {line}")
                  if "timeout=60" in line:
                      raise SystemExit(f"Converter-default Script timeout survived conversion: {line}")
                  modern = re.match(
                      r"^.+?\s*=\s*type=http-(?:request|response),pattern=(.+?),script-path=",
                      line,
                  )
                  if not modern:
                      raise SystemExit(f"Unexpected generated Script syntax: {line}")
                  pattern_value = modern.group(1)
                  if "," in pattern_value and not (
                      len(pattern_value) >= 2
                      and pattern_value.startswith('"')
                      and pattern_value.endswith('"')
                  ):
                      raise SystemExit(f"Comma-bearing Script pattern is not quoted: {line}")

              if result.count("[URL Rewrite]") != 1 or result.count("[Map Local]") != 1:
                  raise SystemExit("Unexpected duplicate/missing rewrite section")
              if "hostname = %APPEND%" not in result:
                  raise SystemExit("MITM hostname list missing")
              if (
                  "#!raw-url=https://raw.githubusercontent.com/mrtanshiyue/Amazon/main/"
                  "modules/StartUpAds-Surge.sgmodule"
              ) not in result:
                  raise SystemExit("Public GitHub raw-url missing or unexpected")

              return result

          upstream = fetch_text(SOURCE)
          converted = convert(upstream)
          TARGET.parent.mkdir(parents=True, exist_ok=True)

          existing = TARGET.read_text(encoding="utf-8") if TARGET.exists() else ""
          if existing == converted:
              print("No upstream changes.")
          else:
              TARGET.write_text(converted, encoding="utf-8")
              print("Updated", TARGET)

      - name: Validate generated module
        shell: python
        run: |
          import re
          from pathlib import Path

          path = Path("modules/StartUpAds-Surge.sgmodule")
          text = path.read_text(encoding="utf-8")

          required = [
              "#!name=Surge 去开屏模块（兼容版）",
              "#!requirement=CORE_VERSION>=20",
              "[Rule]",
              "[URL Rewrite]",
              "[Map Local]",
              "[Body Rewrite]",
              "[Script]",
              "[MITM]",
              "hostname = %APPEND%",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"Missing required content: {item}")

          if len(text) < 60000:
              raise SystemExit("Generated module unexpectedly short")
          if (
              "#!raw-url=https://raw.githubusercontent.com/mrtanshiyue/Amazon/main/"
              "modules/StartUpAds-Surge.sgmodule"
          ) not in text:
              raise SystemExit("Public GitHub raw-url missing or unexpected")
          if re.search(r"\s-\sreject(?:-[A-Za-z0-9_-]+)?\s*$", text, re.MULTILINE):
              raise SystemExit("Found incompatible QX-style reject action")
          if re.search(r"^http-(?:request|response)\s+\S+\s+\S*\"\S*", text, re.MULTILINE):
              raise SystemExit("Found unescaped Body Rewrite quote")
          script_text = text.split("[Script]", 1)[1].split("[MITM]", 1)[0]
          script_lines = [
              line.strip()
              for line in script_text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if not script_lines:
              raise SystemExit("Generated module has no Script entries")

          for line in script_lines:
              if re.match(r"^http-(?:request|response)\s", line):
                  raise SystemExit(f"Found legacy Script syntax: {line}")
              if "max-size=-1" in line:
                  raise SystemExit(f"Found unlimited Script body size: {line}")
              if "timeout=60" in line:
                  raise SystemExit(f"Found converter-default Script timeout: {line}")
              modern = re.match(
                  r"^.+?\s*=\s*type=http-(?:request|response),pattern=(.+?),script-path=",
                  line,
              )
              if not modern:
                  raise SystemExit(f"Found unexpected Script syntax: {line}")
              pattern_value = modern.group(1)
              if "," in pattern_value and not (
                  len(pattern_value) >= 2
                  and pattern_value.startswith('"')
                  and pattern_value.endswith('"')
              ):
                  raise SystemExit(f"Found unquoted comma-bearing Script pattern: {line}")

          print("Surge startup ads module validation passed.")

      - name: Commit only when module changed
        shell: bash
        run: |
          if git diff --quiet -- modules/StartUpAds-Surge.sgmodule; then
            echo "No startup ads changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/StartUpAds-Surge.sgmodule
          git commit -m "chore: sync Surge startup ads module"
          git push
