name: Deploy Cloudflare Keyword Manager

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-keyword-manager
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: amazon-keyword-manager-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install Wrangler
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Ensure private R2 storage bucket
        shell: bash
        run: |
          EXISTS="$(npx wrangler r2 bucket list --json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{
              const rows=JSON.parse(s);
              if(rows.some(x=>x.name===process.env.R2_BUCKET)) process.stdout.write("yes");
            });')"
          if [ "$EXISTS" != "yes" ]; then
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
