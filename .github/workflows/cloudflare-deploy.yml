name: Deploy Cloudflare Keyword Manager

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-keyword-manager
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: amazon-keyword-manager-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install Wrangler
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Frontend runtime smoke test
        run: node scripts/check-frontend.mjs

      - name: Ensure private R2 storage bucket
        shell: bash
        run: |
          if ! npx wrangler r2 bucket info "$R2_BUCKET" --json >/dev/null 2>&1; then
            npx wrangler r2 bucket create "$R2_BUCKET"
          fi

      - name: Deploy Worker and static assets
        run: npx wrangler deploy

      - name: Smoke test deployed site
        working-directory: .
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://amazon-keyword-manager.tanshiyuesir.workers.dev/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://amazon-keyword-manager.tanshiyuesir.workers.dev/api/health | grep '"ok":true'
